# Connect Hub → https://tnvconnecthub.netlify.app  (connect.wearetnv.com after DNS)
# GitHub: herm409/tnv-connect-hub
# Netlify: tnvconnecthub (f04de6d3-f955-4eb8-8e87-075752b1b09a)
# Static site only — no build step. Push main to deploy after Git is linked in Netlify.
# Do not set X-Frame-Options DENY; Personal Links may iframe a preview later.

[build]
  publish = "."

[build.processing]
  skip_processing = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
